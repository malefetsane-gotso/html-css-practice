<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <title>Product Card</title>
</head>
<body>
    <div class="continer">
        <article class="product-card">
            <img src="img/image-product-desktop.jpg" alt="perfume-image">
            <p>PERFUME</p>
            <h1>Gabrielle <br>Essence Eau <br>De Parfum</h1>
            
            <p>A floral, solar and voluptuous <br>interpretation composed bt <br>Oliver Polge, Perfumer-Creator <br>
                for the house of CHANEL
            </p>

            <div class="price-container">
                <span class="current-price">$149.99</span>
                <del class="original-price">$169.99</del>
            </div>

            <button>
                <img src="img/icon-cart.svg" alt="cart-icon">
                Add to Cart
            </button>
        </article>
    </div>
</body>
</html>
